<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Elite Day/Night{% endblock %}</title>
  <link rel="stylesheet" href="/static/site.css">
  <script defer src="/static/site.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Elite Day/Night</a>
  <nav>
    <a href="/systems">Systems</a>
    <a href="/systems/import">Import</a>
    {% if public_poi_submissions_enabled %}<a href="/pois/submit">Submit POI</a>{% endif %}
    <a href="/observations/guide">Guide</a>
    <a href="/about">About</a>
  </nav>
  <form class="top-search system-search" method="get" action="/systems" autocomplete="off">
    <div class="autocomplete-wrap">
      <input name="q" placeholder="Search system" value="{{ q|default('') }}" data-system-autocomplete="1">
      <div class="autocomplete-menu" hidden></div>
    </div>
    <button type="submit">Search</button>
  </form>
</header>
<main class="page">
  {% if message %}<div class="notice">{{ message }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
<footer class="footer">
  <span>Elite Dangerous day/night prediction tool</span>
</footer>
</body>
</html>
