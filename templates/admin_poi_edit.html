{% extends "admin_base.html" %}
{% block title %}Edit POI · Elite Day/Night Control{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Edit POI</h1>
  <p class="muted">{{ poi.system_name }} / {{ poi.body_name }}</p>
  <form method="post" action="/control/pois/{{ poi.id }}/edit" class="stack-form">
    <label>Name
      <input name="name" required maxlength="120" value="{{ poi.name }}">
    </label>
    <label>Submitter
      <input name="submitter_name" maxlength="40" value="{{ poi.submitter_name }}">
    </label>
    <div class="grid two compact-form-grid">
      <label>Latitude
        <input name="lat" required inputmode="decimal" value="{{ poi.lat }}">
      </label>
      <label>Longitude
        <input name="lon" required inputmode="decimal" value="{{ poi.lon }}">
      </label>
    </div>
    <label>Description
      <textarea name="description" rows="5">{{ poi.description }}</textarea>
    </label>
    <label>Status
      <select name="review_status">
        {% for st in ["new", "needs_check", "approved", "rejected", "hidden"] %}
          <option value="{{ st }}" {% if poi.review_status == st %}selected{% endif %}>{{ st }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="check"><input type="checkbox" name="is_public" {% if poi.is_public %}checked{% endif %}> Public / visible on body page when approved</label>
    <button type="submit" class="primary">Save POI</button>
  </form>
  <div class="actions-row">
    <a class="button" href="/control/pois">Back to POIs</a>
    {% if is_super_admin %}<form method="post" action="/control/pois/{{ poi.id }}/delete" onsubmit="return confirm('Delete this POI?');">
      <button type="submit" class="danger-btn">Delete POI</button>
    </form>{% endif %}
  </div>
</section>
{% endblock %}
