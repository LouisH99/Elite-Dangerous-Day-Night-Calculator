{% extends "admin_base.html" %}
{% block title %}Edit Observation · Elite Day/Night{% endblock %}
{% block content %}
<section class="card">
  <div class="split">
    <div>
      <h1>Edit observation #{{ obs.id }}</h1>
      <p class="muted">{{ obs.system_name }} / <b>{{ obs.body_name }}</b></p>
    </div>
    <a class="button" href="/control/observations?status={{ obs.review_status }}">Back to list</a>
  </div>
  <form class="stack-form" method="post" action="/control/observations/{{ obs.id }}/edit">
    <div class="grid two">
      <label>Observer
        <input name="observer_name" value="{{ obs.observer_name or '' }}">
      </label>
      <label>UTC observation time
        <input name="timestamp_utc" value="{{ obs.timestamp_utc }}" required>
      </label>
      <label>Latitude
        <input name="lat" type="number" step="0.000001" min="-90" max="90" value="{{ obs.lat }}" required>
      </label>
      <label>Longitude
        <input name="lon" type="number" step="0.000001" min="-180" max="180" value="{{ obs.lon }}" required>
      </label>
      <label>Observation type
        <select name="observation">
          {% for v in ['elevation','sunrise','sunset','horizon','day','night'] %}
            <option value="{{ v }}" {% if obs.observation == v %}selected{% endif %}>{{ v }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Quality
        <select name="quality">
          {% for v in ['high','medium','low'] %}
            <option value="{{ v }}" {% if obs.quality == v %}selected{% endif %}>{{ v }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Sun altitude / elevation
        <input name="elevation" type="number" step="0.01" value="{{ obs.elevation if obs.elevation is not none else '' }}">
      </label>
      <label>Sun heading
        <input name="heading" type="number" step="0.01" min="0" max="359.999" value="{{ obs.heading if obs.heading is not none else '' }}">
      </label>
      <label>Review status
        <select name="review_status">
          {% for v in ['new','approved','needs_check','rejected','corrected'] %}
            <option value="{{ v }}" {% if obs.review_status == v %}selected{% endif %}>{{ v }}</option>
          {% endfor %}
        </select>
      </label>
    </div>
    <label>Note
      <textarea name="note" rows="4">{{ obs.note }}</textarea>
    </label>
    <div class="actions-row">
      <button class="primary" type="submit">Save changes</button>
      <button type="submit" form="approve-form">Approve</button>
      <button type="submit" form="reject-form" class="danger-btn">Reject</button>
      {% if is_super_admin %}<button type="submit" form="delete-form" class="danger-btn" onclick="return confirm('Delete this observation permanently? Prefer rejecting unless this is truly junk.')">Delete</button>{% endif %}
    </div>
  </form>
  <form id="approve-form" method="post" action="/control/observations/{{ obs.id }}/review">
    <input type="hidden" name="review_status" value="approved"><input type="hidden" name="next_url" value="/control/observations/{{ obs.id }}/edit">
  </form>
  <form id="reject-form" method="post" action="/control/observations/{{ obs.id }}/review">
    <input type="hidden" name="review_status" value="rejected"><input type="hidden" name="next_url" value="/control/observations/{{ obs.id }}/edit">
  </form>
  {% if is_super_admin %}<form id="delete-form" method="post" action="/control/observations/{{ obs.id }}/delete"></form>{% endif %}
</section>
{% endblock %}
